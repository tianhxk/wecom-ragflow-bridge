version: "3.8"

services:
  wecom-RAGFLOW-bridge:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
      tags:
        - wecom-ragflow-bridge:latest
    container_name: wecom-dify-bridge
    image: wecom-ragflow-bridge:${APP_VERSION:-1.0}
    environment:
      - APP_VERSION=${APP_VERSION:-1.0}
    restart: unless-stopped
    volumes:
      - ./.config:/opt/app/config  # 将本地 config 目录挂载到容器内
      - ./logs:/opt/app/logs  # 将文件日志持久化到宿主机
    ports:
      - "8090:8090"  # 微信客服 webhook 回调入口
    # 连接到 RAGFLOW 的 Docker 网络，以便通过内部网络访问 RAGFLOW API
    networks:
      - ragflow-network
      - default

  workbot-query-ui:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
      tags:
        - wecom-workbot-query-ui:latest
    container_name: wecom-workbot-query-ui
    image: wecom-workbot-query-ui:${APP_VERSION:-1.0}
    restart: unless-stopped
    depends_on:
      - wecom-RAGFLOW-bridge
    ports:
      - "8091:80"
    networks:
      - default

networks:
  ragflow-network:
    external: true
    name: docker_ragflow  # RAGFLOW docker-compose 默认创建的网络名
